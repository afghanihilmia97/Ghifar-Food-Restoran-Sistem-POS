# Pasang dalam server HTTPS yang sudah memiliki sertifikat SSL.
# Ganti kasir.domainanda.com dengan domain Anda.
server {
    listen 443 ssl;
    server_name kasir.domainanda.com;
    ssl_certificate /etc/letsencrypt/live/kasir.domainanda.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kasir.domainanda.com/privkey.pem;
    client_max_body_size 3m;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
